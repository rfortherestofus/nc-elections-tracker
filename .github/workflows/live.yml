name: Live results

on:
  # Start by hand from the Actions tab (or `gh workflow run live.yml`)
  workflow_dispatch:
  schedule:
    # Fresh start before polls close: 23:30 UTC November 3 is 3:30 p.m. PT /
    # 6:30 p.m. ET. Scheduled runs can fire late, so this leaves an hour of
    # slack. Starting fresh here puts the 6-hour hand-off near 9:15 p.m. PT,
    # after most results are in, instead of during early results.
    - cron: "30 23 3 11 *"

# Never run two loops at once. A new run replaces the one in progress, so the
# scheduled start above (or a manual start) restarts the loop.
concurrency:
  group: live-results
  cancel-in-progress: true

permissions:
  contents: write # push the rendered site to the cloudflare branch
  actions: write # start a fresh run before the 6-hour job limit

jobs:
  publish-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ELECTION_DATE: "20261103"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      # sf and terra (used by mapgl for the county map) need these libraries
      - name: Install GDAL, GEOS, PROJ and udunits
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish loop
        run: bash scripts/loop.sh
