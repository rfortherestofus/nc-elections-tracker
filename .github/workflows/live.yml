name: Live results

on:
  # Start by hand from the Actions tab (or `gh workflow run live.yml`)
  workflow_dispatch:
  schedule:
    # Backup start: 00:00 UTC November 4 is 4:00 p.m. PT / 7:00 p.m. ET November 3
    - cron: "0 0 4 11 *"

# Never run two loops at once
concurrency:
  group: live-results
  cancel-in-progress: false

permissions:
  contents: write # push the rendered site to the cloudflare branch
  actions: write # start a fresh run before the 6-hour job limit

jobs:
  publish-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ELECTION_DATE: "20261103"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish loop
        run: bash scripts/loop.sh
